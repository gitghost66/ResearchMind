# Production layout (M8): Nginx -> API processes, plus separate research
# workers, all sharing one PostgreSQL.
#
#   # Your database (Supabase, RDS, ...): DATABASE_URL in backend/.env
#   docker compose -f docker-compose.prod.yml up -d --build
#
#   # Or a bundled PostgreSQL + pgvector container, nothing else needed:
#   docker compose -f docker-compose.prod.yml -f docker-compose.localdb.yml up -d --build
#
# Then http://localhost:8080 (set HTTP_PORT to change it). Runs are queued in
# the database: any API process takes requests and streams events, any worker
# executes runs. Kill a worker mid-run and another resumes the run from its
# last checkpoint once the lease (RUN_LEASE_SECONDS) lapses.
#
# Every setting comes from backend/.env (.env.example documents them); only
# the process layout is fixed here. Scale with API_PROCESSES and
# WORKER_REPLICAS. See docs/DEPLOY_AWS.md for AWS.
name: researchmind

x-app: &app
  image: researchmind:latest
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file:
    - path: backend/.env
      required: false
  restart: unless-stopped
  # uvicorn's 5s for open streams + SHUTDOWN_GRACE_SECONDS to hand runs back.
  stop_grace_period: 30s

services:
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *app
    environment:
      # Workers run in their own containers.
      RUN_WORKER_IN_API: "false"
      # uvicorn processes in this container.
      WEB_CONCURRENCY: ${API_PROCESSES:-2}
      # Only Nginx reaches the API, so its X-Forwarded-For is trusted.
      FORWARDED_ALLOW_IPS: "*"
      LOG_FORMAT: json
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["python", "-m", "app.workers.research_worker"]
    environment:
      LOG_FORMAT: json
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
    depends_on:
      migrate:
        condition: service_completed_successfully

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
