[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "researchmind-backend"
version = "0.1.0"
description = "ResearchMind API backend"
requires-python = ">=3.11"
dependencies = [
    # fastapi.sse (built-in Server-Sent Events) is used by the events endpoint.
    "fastapi>=0.156.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30.0",
    # The passages.embedding column type (app/models/evidence.py).
    "pgvector>=0.3.0",
    "alembic>=1.13.0",
    "supabase>=2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0",
    "researchmind-agents",
]

# The eval CLI (python -m researchmind_agents.evals) gets its config from the
# backend's settings through this entry point, so the agents package never
# imports the backend.
[project.entry-points."researchmind_agents.config"]
backend = "app.services.agent_runtime:build_agent_config"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.11",
    "aiosqlite>=0.20.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "--import-mode=importlib"
markers = [
    "integration: needs live external services (real DB or API keys); skipped by default",
]
