# ResearchMind reverse proxy (M8).
#
# Nginx is the edge here: it terminates client connections, streams
# Server-Sent Events without buffering, and passes the real client address to
# the API (which rate-limits by it when a request has no API key).
#
# TLS: terminate it in front (an AWS ALB with an ACM certificate) or here
# (see the commented server block at the end and docs/DEPLOY_AWS.md).

upstream researchmind_api {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # The API's MAX_REQUEST_BODY_BYTES (64 KB) is enforced here first.
    client_max_body_size 64k;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Replace, never append: a client cannot spoof its address through a
    # header of its own. Behind a load balancer instead, trust it with
    #   set_real_ip_from <the balancer's subnet>;
    #   real_ip_header X-Forwarded-For;
    # and $remote_addr becomes the client the balancer saw.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;

    # Server-Sent Events: pass each event through at once, keep streams open.
    location ~ ^/api/v1/research/[^/]+/events$ {
        proxy_pass http://researchmind_api;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://researchmind_api;
        proxy_read_timeout 60s;
    }
}

# HTTPS here instead of at a load balancer (certificates from certbot or ACM
# exported to the host); then redirect port 80 to it.
