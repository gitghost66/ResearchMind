[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "researchmind-agents"
version = "0.1.0"
description = "ResearchMind multi-agent research workflow"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "google-genai>=1.0",
    "pydantic>=2.0",
    # Successor of duckduckgo-search, which stopped returning results.
    "ddgs>=9.16",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["researchmind_agents*"]

[tool.setuptools.package-data]
researchmind_agents = ["evals/*.jsonl", "data/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "--import-mode=importlib"
markers = [
    "integration: needs live external services (real DB or API keys); skipped by default",
]
